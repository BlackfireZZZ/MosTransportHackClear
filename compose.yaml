name: ${COMPOSE_PROJECT_NAME:-tramflow}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tramflow}
      POSTGRES_USER: ${POSTGRES_USER:-tramflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tramflow_local}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["/workspace/.venv/bin/alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://tramflow:tramflow_local@db:5432/tramflow}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  forecast-publish:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - /workspace/.venv/bin/python
      - -m
      - app.infrastructure.forecast_publication
      - --manifest
      - ${FORECAST_MANIFEST:-/workspace/forecast/current.json}
      - --approvals
      - /workspace/approved/approved.json
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://tramflow:tramflow_local@db:5432/tramflow}
    volumes:
      - ${FORECAST_BUNDLE_DIR:-./ml/competition_submissions}:/workspace/forecast:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://tramflow:tramflow_local@db:5432/tramflow}
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      forecast-publish:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready')"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
