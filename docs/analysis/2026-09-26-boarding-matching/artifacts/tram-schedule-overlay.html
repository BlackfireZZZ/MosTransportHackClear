<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<script>
(()=>{

 function restore(s){const p=s?.privateContent;if(p?.version!==3)return;if(['raw','merged'].includes(p.variant))variant=p.variant;if(Number.isInteger(p.selected)&&p.selected>=0&&p.selected<3)selected=p.selected;if(labels[p.methodId])methodId=p.methodId;if(['local','chain'].includes(p.modeId))modeId=p.modeId;if(Number.isInteger(p.pair))pair=p.pair;if(Number.isInteger(p.page)&&p.page>=0&&p.page<6)page=p.page;if(Array.isArray(p.visible))visible=new Set(p.visible.filter(k=>series.some(s=>s.id===k)));}

 function values(){const base=data[selected],w={...base,...base.variants[variant]},f=w.fits[methodId],t=w.methods[methodId];let running=t[0];const expected=f.expected.map((gap,i)=>{running+=gap;return modeId==='local'?t[i]+gap:running;});pair=Math.max(0,Math.min(pair,f.expected.length-1));return {w,f,t,expected};}

 function signed(n){return (n>0?'+':'')+num(n);}
 function legend(){const box=root.querySelector('#schedule-legend');box.replaceChildren();series.forEach(s=>{const b=document.createElement('button');b.type='button';b.className='cursor-interaction';b.setAttribute('aria-pressed',String(visible.has(s.id)));const sw=document.createElement('span');sw.className='swatch';sw.style.borderColor=s.color;sw.style.borderTopStyle=s.dash?'dashed':'solid';sw.setAttribute('aria-hidden','true');b.append(sw,document.createTextNode(s.label));b.addEventListener('click',()=>{visible.has(s.id)?visible.delete(s.id):visible.add(s.id);render();save();});box.append(b);});}
 function countTable(){const {w,t,expected}=values();root.querySelector('#schedule-count-head').innerHTML='<tr><th scope="col">Интервал</th>'+w.devices.map(d=>'<th scope="col" class="text-end">'+d+'</th>').join('')+'<th scope="col" class="text-end">Всего</th><th scope="col">По оплатам / ожидание</th></tr>';const body=root.querySelector('#schedule-count-body');body.replaceChildren();for(let b=page*10;b<(page+1)*10;b++){const a=t.filter(v=>v>=b*30&&v<(b+1)*30),e=expected.filter(v=>v>=b*30&&v<(b+1)*30);const tr=document.createElement('tr');if(Math.floor(t[pair+1]/30)===b)tr.className='selected-row';tr.innerHTML='<th class="text-nowrap" scope="row">'+w.clock[b]+'–'+w.clock[b+1]+'</th>'+w.counts[b].map(n=>'<td class="text-end">'+n+'</td>').join('')+'<td class="text-end">'+d3.sum(w.counts[b])+'</td><td>'+(a.map(clock).join(', ')||'—')+' / '+(e.map(clock).join(', ')||'—')+'</td>';body.append(tr);}
 root.querySelector('#schedule-count-foot').innerHTML='<tr><th scope="row">Все 30 минут</th>'+w.devices.map((_,j)=>'<td class="text-end">'+d3.sum(w.counts,r=>r[j])+'</td>').join('')+'<td class="text-end">'+w.total+'</td><td></td></tr>';root.querySelector('#schedule-page').textContent=w.clock[page*10]+'–'+w.clock[(page+1)*10]+' · '+(page+1)+'/6';root.querySelector('#schedule-prev').disabled=page===0;root.querySelector('#schedule-next').disabled=page===5;}
 function intervals(){const {w,f,t,expected}=values();const body=root.querySelector('#schedule-intervals');body.replaceChildren();f.expected.forEach((gap,i)=>{const tr=document.createElement('tr');if(i===pair)tr.className='selected-row';const th=document.createElement('th');th.scope='row';const b=document.createElement('button');b.type='button';b.className='btn btn-ghost';b.textContent=(i+1)+'→'+(i+2);b.setAttribute('aria-label','Выделить промежуток '+(i+1)+' на графике');b.addEventListener('click',()=>{pair=i;page=Math.min(5,Math.floor(t[i+1]/300));render();save();});th.append(b);tr.append(th);const obs=t[i+1]-t[i];[clock(t[i])+'–'+clock(t[i+1]),num(obs),num(gap),signed(obs-gap),f.steps[i],f.geometry[i]?'Смешанная':'Расписание'].forEach((value,j)=>{const td=document.createElement('td');td.textContent=value;if(j>0&&j<5)td.className='text-end';if(j===0)td.classList.add('text-nowrap');tr.append(td);});body.append(tr);});
 root.querySelector('#schedule-detail').textContent='Пара '+(pair+1)+'→'+(pair+2)+': начало '+clock(t[pair+1])+' · ожидание '+clock(expected[pair])+' · разница '+signed(t[pair+1]-expected[pair])+' с';
 root.querySelector('#schedule-metrics').textContent='Средняя ошибка интервалов: '+num(f.mae)+' с · контроль: '+num(f.null_mae)+' с · почти равных начальных позиций: '+f.phases;
 root.querySelector('#schedule-meta').textContent=w.total+' оплат · '+t.length+' начал'+(variant==='merged'?' · объединено '+w.merge[methodId].merged_candidates+' меток':' · без объединения')+(variant==='merged'?' · первая оплата '+clock(t[0])+' — граничная гипотеза':'')+' · прокси-расписание, не подтверждённый рейс';countTable();}
 function draw(){const {w,f,t,expected}=values();width=root.querySelector('.plotbox').getBoundingClientRect().width;if(width<1)return;const height=365;frame={left:64,right:width-18,top:44,bottom:height-62};svg.attr('width',width).attr('height',height).attr('viewBox','0 0 '+width+' '+height);svg.selectAll('*').remove();svg.append('title').text('Маршрут '+w.route+'. Серые столбики: оплаты за30секунд. Красные линии: '+labels[methodId]+'. Пунктир: ожидаемые начала.');
 const totals=w.counts.map(r=>d3.sum(r));const extent=d3.extent([0,1800,...t,...expected]);const padding=Math.max(10,(extent[1]-extent[0])*.01);x=d3.scaleLinear().domain([extent[0]-padding,extent[1]+padding]).range([frame.left+4,frame.right-4]);y=d3.scaleLinear().domain([0,Math.max(1,d3.max(totals))*1.2]).nice().range([frame.bottom-1,frame.top+6]);
 svg.append('rect').attr('data-chart-frame','').attr('x',frame.left).attr('y',frame.top).attr('width',frame.right-frame.left).attr('height',frame.bottom-frame.top).attr('fill','none').attr('stroke','var(--border)');
 y.ticks(5).filter(n=>Number.isInteger(n)&&n>0).forEach(n=>svg.append('line').attr('x1',frame.left).attr('x2',frame.right).attr('y1',y(n)).attr('y2',y(n)).attr('stroke','var(--border)').attr('stroke-opacity',.55));
 svg.selectAll('.bar').data(totals).join('rect').attr('class','bar').attr('x',(_,i)=>x(i*30)+.5).attr('y',d=>y(d)).attr('width',Math.max(.5,x(30)-x(0)-1)).attr('height',d=>y(0)-y(d)).attr('fill','var(--foreground)').attr('opacity',(_,i)=>i===Math.floor(t[pair+1]/30)?.38:.17);
 expected.forEach((time,i)=>{const kind=f.geometry[i]?'geometry':'expected';if(!visible.has(kind))return;const s=series.find(v=>v.id===kind);svg.append('line').attr('data-expected',i).attr('x1',x(time)).attr('x2',x(time)).attr('y1',frame.top+4).attr('y2',frame.bottom-1).attr('stroke',s.color).attr('stroke-width',i===pair?2.6:1.7).attr('stroke-dasharray',s.dash).attr('opacity',i===pair?1:.75);});

 const ticks=width<440?[0,900,1800]:[0,300,600,900,1200,1500,1800];const xa=svg.append('g').attr('transform','translate(0,'+frame.bottom+')').call(d3.axisBottom(x).tickValues(ticks).tickFormat(v=>clock(v).slice(0,5)).tickSize(4));xa.select('.domain').remove();xa.selectAll('.tick').each(function(v){d3.select(this).select('text').attr('text-anchor',v===0?'start':v===1800?'end':'middle');});const ya=svg.append('g').attr('transform','translate('+frame.left+',0)').call(d3.axisLeft(y).tickValues(y.ticks(5).filter(Number.isInteger)).tickSize(4));ya.select('.domain').remove();svg.selectAll('.tick line').attr('stroke','var(--border)');svg.append('text').attr('class','axis-title').attr('data-axis','y').attr('x',frame.left).attr('y',20).text('Оплаты / 30 с');svg.append('text').attr('class','axis-title').attr('data-axis','x').attr('x',(frame.left+frame.right)/2).attr('y',height-14).attr('text-anchor','middle').text('Время · Москва');
 const guide=svg.append('line').attr('data-chart-hover-guide','').attr('y1',frame.top).attr('y2',frame.bottom).attr('stroke','var(--foreground)').attr('visibility','hidden');
 svg.append('rect').attr('data-chart-hit','').attr('data-chart-hover-overlay','cross-series').attr('x',frame.left).attr('y',frame.top).attr('width',frame.right-frame.left).attr('height',frame.bottom-frame.top).attr('fill','transparent').on('pointermove',function(event){const [px]=d3.pointer(event,this),second=x.invert(px),b=Math.max(0,Math.min(59,Math.floor(second/30)));const i=d3.bisector(v=>v).center(t.slice(1),second);guide.attr('x1',px).attr('x2',px).attr('visibility','visible');tip.innerHTML='<strong>'+w.clock[b]+'–'+w.clock[b+1]+'</strong><div>Оплат: '+totals[b]+'</div><div>Ближайшая пара '+(i+1)+'→'+(i+2)+'</div>'+(visible.has('actual')?'<div>По оплатам: '+clock(t[i+1])+'</div>':'')+(visible.has(f.geometry[i]?'geometry':'expected')?'<div>Ожидание: '+clock(expected[i])+'</div>':'');tip.hidden=false;const r=root.getBoundingClientRect();tip.style.left=Math.max(0,Math.min(width-tip.offsetWidth,event.clientX-r.left+10))+'px';tip.style.top=Math.max(0,event.clientY-r.top-tip.offsetHeight-10)+'px';}).on('pointerleave',()=>{guide.attr('visibility','hidden');tip.hidden=true;}).on('click',function(event){const [px]=d3.pointer(event,this);pair=d3.bisector(v=>v).center(t.slice(1),x.invert(px));page=Math.min(5,Math.floor(t[pair+1]/300));tip.hidden=true;render();save();});
 const boxes=xa.selectAll('.tick text').nodes().map(el=>({el,box:el.getBoundingClientRect()}));for(let i=1;i<boxes.length-1;i++)if(boxes[i].box.left-boxes[i-1].box.right<4)d3.select(boxes[i].el.parentNode).remove();}
 function render(){route.value=selected;method.value=methodId;mode.value=modeId;root.querySelector('#schedule-variant').value=variant;legend();intervals();draw();}
